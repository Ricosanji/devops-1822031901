name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Kiem tra du 3 file
        run: |
          for f in index.html style.css script.js; do
            if [ ! -f "$f" ]; then
              echo "::error::Thieu file $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Kiem tra index.html co the title
        run: |
          if ! grep -q "<title>" index.html; then
            echo "::error::index.html thieu the <title>"
            exit 1
          fi
          echo "OK: co the <title>"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
